<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Background Template - KaiDjuric AI Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --dark: #0f172a;
            --light: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Base animated background container */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Cosmic particles animation */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite linear;
        }

        .particle:nth-child(odd) {
            background: rgba(99, 102, 241, 0.6);
            animation-duration: 25s;
        }

        .particle:nth-child(3n) {
            background: rgba(139, 92, 246, 0.5);
            animation-duration: 30s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Neural network grid */
        .neural-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 25%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 25% 75%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            animation: neural-pulse 8s ease-in-out infinite;
        }

        @keyframes neural-pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        /* Shimmer overlay (like your portfolio) */
        .shimmer-overlay {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 15s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Gradient waves */
        .gradient-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(99, 102, 241, 0.1) 0%,
                rgba(139, 92, 246, 0.1) 25%,
                rgba(236, 72, 153, 0.1) 50%,
                rgba(139, 92, 246, 0.1) 75%,
                rgba(99, 102, 241, 0.1) 100%
            );
            background-size: 400% 400%;
            animation: gradient-flow 20s ease infinite;
        }

        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* AI processing effect */
        .ai-processing {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            animation: ai-pulse 3s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .ai-processing.active {
            opacity: 1;
        }

        @keyframes ai-pulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* Content overlay */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: title-glow 4s ease-in-out infinite;
        }

        @keyframes title-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Background mode selector */
        .mode-selector {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 100;
        }

        .mode-btn {
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        .mode-btn.active {
            background: var(--primary);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            .mode-selector {
                top: 1rem;
                right: 1rem;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background Container -->
    <div class="animated-bg" id="animatedBg">
        <!-- Particles -->
        <div class="particles" id="particles"></div>

        <!-- Neural Network Grid -->
        <div class="neural-grid"></div>

        <!-- Gradient Waves -->
        <div class="gradient-waves"></div>

        <!-- Shimmer Effect -->
        <div class="shimmer-overlay"></div>

        <!-- AI Processing Effect -->
        <div class="ai-processing" id="aiProcessing"></div>
    </div>

    <!-- Background Mode Selector -->
    <div class="mode-selector">
        <button class="mode-btn active" onclick="setBackgroundMode('cosmic')">Cosmic</button>
        <button class="mode-btn" onclick="setBackgroundMode('neural')">Neural</button>
        <button class="mode-btn" onclick="setBackgroundMode('minimal')">Minimal</button>
        <button class="mode-btn" onclick="setBackgroundMode('immersive')">Immersive</button>
    </div>

    <!-- Content -->
    <div class="content">
        <h1 class="title">AI Tools Ecosystem</h1>
        <p class="subtitle">Unified animated backgrounds for all applications</p>

        <div class="controls">
            <button class="btn" onclick="triggerAIEffect()">Trigger AI Effect</button>
            <button class="btn" onclick="toggleParticles()">Toggle Particles</button>
            <button class="btn" onclick="randomizeAnimation()">Randomize</button>
        </div>
    </div>

    <script>
        // Background mode management
        let currentMode = 'cosmic';
        let particlesEnabled = true;
        let aiEffectActive = false;

        // Initialize particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            particlesContainer.innerHTML = '';

            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // Random size and position
                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';

                particlesContainer.appendChild(particle);
            }
        }

        // Set background mode
        function setBackgroundMode(mode) {
            currentMode = mode;
            const bg = document.getElementById('animatedBg');

            // Update active button
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Apply mode-specific styles
            switch(mode) {
                case 'cosmic':
                    bg.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    document.querySelector('.neural-grid').style.opacity = '0.3';
                    document.querySelector('.gradient-waves').style.opacity = '1';
                    break;

                case 'neural':
                    bg.style.background = 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)';
                    document.querySelector('.neural-grid').style.opacity = '0.8';
                    document.querySelector('.gradient-waves').style.opacity = '0.3';
                    break;

                case 'minimal':
                    bg.style.background = 'linear-gradient(135deg, #1e293b 0%, #334155 100%)';
                    document.querySelector('.neural-grid').style.opacity = '0.1';
                    document.querySelector('.gradient-waves').style.opacity = '0.2';
                    break;

                case 'immersive':
                    bg.style.background = 'linear-gradient(135deg, #4c1d95 0%, #7c2d12 50%, #1e40af 100%)';
                    document.querySelector('.neural-grid').style.opacity = '0.6';
                    document.querySelector('.gradient-waves').style.opacity = '0.8';
                    break;
            }
        }

        // Trigger AI processing effect
        function triggerAIEffect() {
            const aiProcessing = document.getElementById('aiProcessing');
            aiProcessing.classList.add('active');

            setTimeout(() => {
                aiProcessing.classList.remove('active');
            }, 5000);
        }

        // Toggle particles
        function toggleParticles() {
            particlesEnabled = !particlesEnabled;
            const particles = document.getElementById('particles');
            particles.style.display = particlesEnabled ? 'block' : 'none';
        }

        // Randomize animation parameters
        function randomizeAnimation() {
            const particles = document.querySelectorAll('.particle');
            particles.forEach(particle => {
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
            });

            // Randomize colors
            const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#06b6d4', '#10b981'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.documentElement.style.setProperty('--primary', randomColor);
        }

        // Initialize on load
        window.addEventListener('load', () => {
            createParticles();
            setBackgroundMode('cosmic');
        });

        // Auto-trigger AI effect every 30 seconds
        setInterval(() => {
            if (Math.random() > 0.7) {
                triggerAIEffect();
            }
        }, 30000);

        // Responsive particle count
        function updateParticleCount() {
            const width = window.innerWidth;
            const count = width < 768 ? 25 : width < 1200 ? 35 : 50;
            createParticles();
        }

        window.addEventListener('resize', updateParticleCount);
    </script>
</body>
</html>
